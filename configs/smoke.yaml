# Tiny end-to-end check on synthetic data (make_synthetic_data.py). Minutes on GPU.
inherit: baseline.yaml

data:
  root: data/synthetic/MAGFiLO_1.0_Kaggle_2026
  train_json: data/synthetic/MAGFiLO_1.0_Kaggle_2026/train/MAGFiLO_1.0_Annotations_kaggle2026_train.json
  train_images: data/synthetic/MAGFiLO_1.0_Kaggle_2026/train/train_images
  test_images: data/synthetic/MAGFiLO_1.0_Kaggle_2026/test/test_images
  cache_dir: data/synthetic/cache
  disk_prior: false        # synthetic disks have random radii
  n_folds: 3
  input_size: 512
  repeats: 4

model:
  encoder_weights: null    # no download needed for the smoke test

train:
  epochs: 3
  batch_size: 4
  grad_accum: 1
  num_workers: 0
  val_every: 1
  val_eval_size: 512

paths:
  out_dir: runs/smoke
