# C4: crop2048 with a ConvNeXt-B encoder (Meta ImageNet-22k -> 1k).
#   curl -L -o weights/convnext_base_22k_1k_224.pth https://dl.fbaipublicfiles.com/convnext/convnext_base_22k_1k_224.pth
inherit: crop2048_convnext.yaml

model:
  encoder: tu-convnext_base
  encoder_kwargs:
    pretrained_cfg_overlay:
      file: weights/convnext_base_22k_1k_224.pth

paths:
  out_dir: runs/crop2048_convnext_base
